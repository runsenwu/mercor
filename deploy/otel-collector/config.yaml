# OpenTelemetry Collector (contrib 0.164). api and worker send traces, metrics and logs here over OTLP.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch:
    send_batch_size: 8192
    timeout: 1s
  # Tail sampling: keep every error trace and every trace that has a slow span, plus a probabilistic
  # share of the rest. Trade-off: spans are held in memory for decision_wait (memory and a 5 s delay
  # before traces show in Tempo), and all spans of a trace must reach this one collector instance.
  # The slow rule is per span, not per trace: a redirect trace continues into the async worker, so
  # trace-level duration would include queue time and mark almost every trace as slow.
  tail_sampling:
    decision_wait: 5s
    num_traces: 200000
    expected_new_traces_per_sec: 5000
    decision_cache:
      sampled_cache_size: 200000
      non_sampled_cache_size: 400000
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow-spans
        type: ottl_condition
        ottl_condition:
          error_mode: ignore
          span:
            - 'span.end_time_unix_nano - span.start_time_unix_nano > 200000000'
      - name: baseline
        type: probabilistic
        probabilistic:
          sampling_percentage: ${env:TAIL_SAMPLING_PERCENT:-10}

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true      # needed for exemplars
    metric_expiration: 2m          # series of a removed replica disappear after 2 min
    resource_to_telemetry_conversion:
      enabled: true                # service.name -> service_name, service.instance.id -> service_instance_id

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
