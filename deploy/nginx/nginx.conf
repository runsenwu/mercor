# The only public entry point (host 8080 -> :80). Copied to /etc/nginx/nginx.conf at start so the image's
# autotune script can replace `worker_processes auto` with the container CPU quota (nginx itself counts host cores).
# After editing: docker compose -f deploy/docker-compose.yml restart nginx
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Docker's embedded DNS, re-resolved every 5 s: `--scale api=N` is picked up without restarting nginx.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    log_format main '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time up=$upstream_addr tp=$http_traceparent';
    # Per-request logging costs throughput (formatting + the Docker log driver), so it is buffered.
    # For max-throughput runs use `access_log off;` or log only errors with `if=`.
    access_log /var/log/nginx/access.log main buffer=64k flush=5s;

    keepalive_timeout 65s;
    keepalive_requests 10000;
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;

    upstream api {
        zone api 64k;                 # shared memory, required for `resolve`
        server api:8080 resolve;      # one entry per api replica, refreshed from DNS
        keepalive 64;                 # idle upstream connections per worker
        keepalive_requests 10000;
        keepalive_timeout 60s;
    }

    server {
        listen 80 reuseport default_server;
        server_name _;

        # Health and metrics endpoints are internal only (case-insensitive: ASP.NET routing is).
        location ~* ^/(healthz|readyz|metrics)/?$ {
            return 404;
        }

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # $http_host keeps the port (localhost:8080); $host drops it, which made the OpenAPI
            # document advertise http://localhost/ and broke "Send" in the /docs UI.
            proxy_set_header Host $http_host;
            # Overwrite, not append: we are the edge, so a client-sent X-Forwarded-For must not pick its rate-limit partition.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            # traceparent/tracestate/baggage pass through untouched (nginx forwards all request headers).
            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
        }
    }

    # Internal only (port 8081 is not published): stub_status for an nginx exporter / debugging.
    server {
        listen 8081;
        access_log off;
        location = /stub_status { stub_status; }
        location / { return 404; }
    }
}
