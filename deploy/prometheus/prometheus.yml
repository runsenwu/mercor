global:
  scrape_interval: 5s
  evaluation_interval: 5s

storage:
  tsdb:
    out_of_order_time_window: 10m   # k6 remote write can arrive late

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ['localhost:9090'] }]

  # App metrics (api, worker) via the collector. honor_labels keeps job/instance = service name/instance.
  - job_name: otel-collector
    honor_labels: true
    static_configs: [{ targets: ['otel-collector:8889'] }]

  - job_name: otel-collector-self
    static_configs: [{ targets: ['otel-collector:8888'] }]

  - job_name: rabbitmq
    static_configs: [{ targets: ['rabbitmq:15692'] }]

  - job_name: postgres
    static_configs: [{ targets: ['postgres-exporter:9187'] }]

  - job_name: redis
    static_configs: [{ targets: ['redis-exporter:9121'] }]

  - job_name: tempo
    static_configs: [{ targets: ['tempo:3200'] }]

  - job_name: loki
    static_configs: [{ targets: ['loki:3100'] }]
