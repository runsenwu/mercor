default_user = shortener
default_pass = shortener
default_vhost = /
# Per-queue metrics on :15692/metrics (queue depth for clicks.analytics and the DLQ).
prometheus.return_per_object_metrics = true
# The container limit is 1 GB; RabbitMQ would otherwise size its memory alarm from host RAM.
total_memory_available_override_value = 1073741824
